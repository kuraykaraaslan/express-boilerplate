name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      package_name: ${{ steps.config.outputs.package_name }}
      product_name: ${{ steps.config.outputs.product_name }}
      vendor: ${{ steps.config.outputs.vendor }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$GITHUB_REF_NAME"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: config
        shell: bash
        run: |
          node -e "const c=require('./release.config.json'); console.log('package_name='+c.packageName); console.log('product_name='+c.productName); console.log('vendor='+c.vendor)" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run typecheck

  deb:
    needs: validate
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_PACKAGE_NAME: ${{ needs.validate.outputs.package_name }}
      RELEASE_PRODUCT_NAME: ${{ needs.validate.outputs.product_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:obfuscate
      - run: npm run release:build:deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: .build/release/*.deb

  rpm:
    needs: validate
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_PACKAGE_NAME: ${{ needs.validate.outputs.package_name }}
      RELEASE_PRODUCT_NAME: ${{ needs.validate.outputs.product_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm run build:obfuscate
      - run: npm run release:build:rpm
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: .build/release/*.rpm

  windows:
    needs: validate
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_PACKAGE_NAME: ${{ needs.validate.outputs.package_name }}
      RELEASE_PRODUCT_NAME: ${{ needs.validate.outputs.product_name }}
      RELEASE_VENDOR: ${{ needs.validate.outputs.vendor }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:obfuscate
        shell: bash
      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix
      - run: ./scripts/release/build-windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: .build/release/*.exe

  docker:
    needs: validate
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_PACKAGE_NAME: ${{ needs.validate.outputs.package_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: docker/setup-buildx-action@v3
      - run: npm ci
      - run: npm run release:build:docker
      - uses: actions/upload-artifact@v4
        with:
          name: docker
          path: .build/release/*_docker.tar

  publish:
    needs: [validate, deb, rpm, windows, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: sha256sum release/* > release/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*
          generate_release_notes: true
          body: |
            ## ${{ needs.validate.outputs.product_name }} ${{ github.ref_name }}

            This release contains the obfuscated production distribution of the Express API server.

            ### Artifacts

            - `${{ needs.validate.outputs.package_name }}_${{ needs.validate.outputs.version }}_amd64.deb`
            - `${{ needs.validate.outputs.package_name }}_${{ needs.validate.outputs.version }}_x86_64.rpm`
            - `${{ needs.validate.outputs.package_name }}_${{ needs.validate.outputs.version }}_win.exe`
            - `${{ needs.validate.outputs.package_name }}_${{ needs.validate.outputs.version }}_docker.tar`
            - `SHA256SUMS`

            Source maps and TypeScript source files are not included in the obfuscated distribution.
            Obfuscation increases reverse-engineering cost but is not encryption.
            Configure database, Redis, JWT, and provider credentials through the environment file.
